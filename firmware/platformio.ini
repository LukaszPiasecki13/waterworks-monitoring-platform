[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Pre-build hook: validate sensor registry sync with backend before compilation
extra_scripts = scripts/prebuild.py
; TODO: Remove .git from firmware/lib/Adafruit_MAX31865/ before committing to avoid gitlink without .gitmodules
lib_deps =
    https://github.com/lewisxhe/TinyGSM-fork.git
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit MAX31865 library @ ^1.3.0
build_flags =
    -D TINY_GSM_MODEM_A76XXSSL
    -D TINY_GSM_RX_BUFFER=1024
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=15
    -D CONFIG_BOOTLOADER_WDT_DISABLE=1
    -D LOG_LEVEL=LOG_INFO
    -Iinclude
lib_extra_dirs = ${PROJECT_DIR}/lib

[env:native]
platform = native
test_framework = googletest
test_ignore_pattern = *_disabled.cpp
; Host-side tests build the JSON payload for real rather than asserting on a
; hand-written string, so they need the same JSON library as the target build.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
lib_extra_dirs = ${PROJECT_DIR}/lib
