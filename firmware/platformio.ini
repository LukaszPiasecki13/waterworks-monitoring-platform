[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Pre-build hook: generate SensorRegistry.h and validate sync with backend
extra_scripts = pre:scripts/prebuild.py
; TODO: Remove .git from firmware/lib/Adafruit_MAX31865/ before committing to avoid gitlink without .gitmodules
lib_deps =
    https://github.com/lewisxhe/TinyGSM-fork.git
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit MAX31865 library @ ^1.3.0
build_flags =
    -D TINY_GSM_MODEM_A76XXSSL
    -D TINY_GSM_RX_BUFFER=1024
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=15
    -D CONFIG_BOOTLOADER_WDT_DISABLE=1
    -D LOG_LEVEL=LOG_INFO
    -Iinclude
lib_extra_dirs = ${PROJECT_DIR}/lib

; Testy jednostkowe na hoście (googletest). Sprzęt zastępuje warstwa zgodności
; z `test/support/` — patrz docs/technical/firmware/07_testy_i_pokrycie.md.
[env:native]
platform = native
test_framework = googletest
; Ten sam hook co dla ESP32: generuje SensorRegistry.h oraz kontrakt payloadu
; (PayloadContract.h) z schematu backendu, zanim testy się skompilują.
extra_scripts = pre:scripts/prebuild.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
; Biblioteki nietestowalne na hoście: wymagają NVS, mbedTLS, NeoPixela lub
; globali z pamięci RTC. Ich konsumenci zależą od interfejsów z lib/Interfaces.
lib_ignore =
    DeviceIdentity
    TelemetryHttpClient
    StatusLed
    TimeSync
build_flags =
    -std=gnu++17
    -D LOG_LEVEL=LOG_INFO
    -D PIO_NATIVE_TEST
    -Iinclude
    -Itest/support
    -Itest/contract
